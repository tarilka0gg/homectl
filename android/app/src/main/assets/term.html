<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="xterm/xterm.css">
<style>
  html,body{margin:0;background:#0b0f14;color:#ccc;font:14px sans-serif;overflow:hidden}
  /* html height:100% resolves to 0 in Android WebView, so pin to the viewport instead */
  #wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
  #term{flex:1;min-height:0;padding:4px}
  #keys{display:flex;gap:6px;padding:6px;background:#161b22;overflow-x:auto;flex:none}
  #keys button{flex:none;min-width:44px;padding:9px 10px;border:0;border-radius:8px;background:#2a313c;color:#e6edf3;font:14px monospace}
  #keys button.on{background:#3b82f6}
  #msg{position:absolute;top:8px;right:8px;padding:6px 10px;border-radius:8px;background:#7f1d1d;color:#fff;display:none}
</style>
<div id="wrap">
  <div id="term"></div>
  <div id="keys"></div>
</div>
<div id="msg"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script>
const term = new Terminal({fontSize: 13, cursorBlink: true, scrollback: 5000, fontFamily: 'monospace',
  theme: {background: '#0b0f14'}});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
let ws = null, url = null, ctrl = false;
const enc = new TextEncoder();
const msg = document.getElementById('msg');

function status(t) { msg.textContent = t || ''; msg.style.display = t ? 'block' : 'none'; }
function send(s) { if (ws && ws.readyState === 1) ws.send(enc.encode(s)); }
function resize() {
  fit.fit();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({resize: [term.cols, term.rows]}));
}
window.hcSend = send;

window.hcStart = function (u) {
  url = u;
  if (ws) { ws.onclose = null; ws.close(); }
  fit.fit();
  ws = new WebSocket(u + '&cols=' + term.cols + '&rows=' + term.rows);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { status(''); term.focus(); };
  ws.onmessage = e => term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data);
  ws.onclose = () => { status('disconnected — tap to reconnect'); };
  ws.onerror = () => { status('connection failed — tap to retry'); };
};
msg.onclick = () => url && window.hcStart(url);

term.onData(d => {
  if (ctrl && d.length === 1) {
    const c = d.toUpperCase().charCodeAt(0);
    if (c >= 64 && c <= 95) d = String.fromCharCode(c - 64);
    setCtrl(false);
  }
  send(d);
});
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(document.getElementById('term'));

const keysDiv = document.getElementById('keys');
let ctrlBtn;
function setCtrl(v) { ctrl = v; ctrlBtn.classList.toggle('on', v); }
[['Esc', '\x1b'], ['Tab', '\t'], ['Ctrl', null], ['↑', '\x1b[A'], ['↓', '\x1b[B'], ['←', '\x1b[D'], ['→', '\x1b[C'],
 ['|', '|'], ['~', '~'], ['-', '-'], ['/', '/'], ['Home', '\x1b[H'], ['End', '\x1b[F'], ['PgUp', '\x1b[5~'], ['PgDn', '\x1b[6~']]
  .forEach(([label, seq]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('touchstart', e => e.preventDefault(), {passive: false});
    b.onclick = () => { if (seq === null) setCtrl(!ctrl); else { send(seq); } term.focus(); };
    if (seq === null) ctrlBtn = b;
    keysDiv.appendChild(b);
  });
</script>
