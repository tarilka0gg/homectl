[package]
name = "homectl"
version = "0.18.7"
edition = "2021"
description = "Control my machines and smart home from one daemon + Android-friendly web UI"
license = "GPL-2.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "process", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }

[build-dependencies]
cc = "1"
