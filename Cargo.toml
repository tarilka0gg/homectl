[package]
name = "homectl"
version = "0.1.0"
edition = "2021"
description = "Control my machines and smart home from one daemon + Android-friendly web UI"
license = "GPL-2.0-or-later"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
