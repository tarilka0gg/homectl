[package]
name = "homectl"
version = "0.19.3"
edition = "2021"
description = "Control my machines and smart home from one daemon + Android-friendly web UI"
license = "GPL-2.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "process", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }

[build-dependencies]
cc = "1"

# Smaller, leaner daemon: one codegen unit with fat LTO drops unused code from the many dependencies, and stripping removes
# symbols. Panics still unwind (a panic in one request task must not take the daemon down).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"

# The pairing window (`homectl-pair`): needs GTK 4, so it is not part of the static daemon build.
[features]
gui = ["dep:gtk"]

[dependencies.gtk]
package = "gtk4"
version = "0.11"
optional = true
features = ["v4_10"]

[[bin]]
name = "homectl-pair"
path = "src/bin/homectl-pair.rs"
required-features = ["gui"]
